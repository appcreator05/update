// IndexedDB Initialization
let db;
const dbName = "VDOSkyDB";
const storeName = "moviesStore";
const imageStoreName = "imagesStore";

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 2);
        request.onerror = (event) => reject(event.target.error);
        request.onsuccess = (event) => {
            db = event.target.result;
            resolve(db);
        };
        request.onupgradeneeded = (event) => {
            const dbInstance = event.target.result;
            if (!dbInstance.objectStoreNames.contains(storeName)) {
                dbInstance.createObjectStore(storeName, { keyPath: "id" });
            }
            if (!dbInstance.objectStoreNames.contains(imageStoreName)) {
                dbInstance.createObjectStore(imageStoreName, { keyPath: "url" });
            }
        };
    });
}

function getCachedMovies() {
    return new Promise((resolve) => {
        if (!db) return resolve(null);
        const transaction = db.transaction(storeName, "readonly");
        const store = transaction.objectStore(storeName);
        const request = store.get("all_movies");
        request.onsuccess = (event) => resolve(event.target.result ? event.target.result.data : null);
        request.onerror = () => resolve(null);
    });
}

function saveMoviesToCache(data) {
    if (!db) return;
    const transaction = db.transaction(storeName, "readwrite");
    const store = transaction.objectStore(storeName);
    store.put({ id: "all_movies", data: data });
}

function getCachedImage(url) {
    return new Promise((resolve) => {
        if (!db) return resolve(null);
        try {
            const transaction = db.transaction(imageStoreName, "readonly");
            const store = transaction.objectStore(imageStoreName);
            const request = store.get(url);
            request.onsuccess = (event) => {
                if (event.target.result && event.target.result.blob) {
                    resolve(URL.createObjectURL(event.target.result.blob));
                } else {
                    resolve(null);
                }
            };
            request.onerror = () => resolve(null);
        } catch(e) {
            resolve(null);
        }
    });
}

function saveImageToCache(url, blob) {
    if (!db) return;
    try {
        const transaction = db.transaction(imageStoreName, "readwrite");
        const store = transaction.objectStore(imageStoreName);
        store.put({ url: url, blob: blob });
    } catch(e) {}
}

function fixPlyrTimeline() {
    const progressContainer = document.querySelector('.plyr__progress');
    const seekInput = document.querySelector('.plyr__progress input[type=range]');
    if (!progressContainer || !seekInput) return;

    function handleSeek(e) {
        if (window.innerHeight > window.innerWidth) {
            const rect = progressContainer.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            
            const relativeY = touch.clientY - rect.top;
            let percentage = relativeY / rect.height;
            
            if (percentage < 0) percentage = 0;
            if (percentage > 1) percentage = 1;
            
            if (player.duration) {
                const newTime = player.duration * percentage;
                player.currentTime = newTime;
                
                const inputMax = seekInput.getAttribute('max') || 100;
                const inputValue = percentage * inputMax;
                seekInput.value = inputValue;
                
                const event = new Event('input', { bubbles: true });
                seekInput.dispatchEvent(event);
            }
            
            if (e.type === 'click') {
                e.preventDefault();
            }
            e.stopPropagation();
        }
    }

    progressContainer.removeEventListener('touchstart', handleSeek);
    progressContainer.removeEventListener('touchmove', handleSeek);
    progressContainer.removeEventListener('click', handleSeek);

    progressContainer.addEventListener('touchstart', handleSeek, { passive: false });
    progressContainer.addEventListener('touchmove', handleSeek, { passive: false });
    progressContainer.addEventListener('click', handleSeek, { passive: false });
}

function processAndShuffleMovies(movies) {
    if (movies.length <= 5) return movies;
    let firstFive = movies.slice(0, 5);
    let remaining = movies.slice(5);
    
    for (let i = remaining.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
    }
    return [...firstFive, ...remaining];
}

async function loadMovies() {
    loader.style.display = "flex";
    try {
        await initDB();
        
        const cachedData = await getCachedMovies();
        if (cachedData && cachedData.length > 0) {
            allMoviesData = processAndShuffleMovies(cachedData);
            initGridView();
            loader.style.display = "none";
            
            fetch("https://raw.githubusercontent.com/appcreator05/post/main/8468988.json" + "?t=" + new Date().getTime())
                .then(res => res.json())
                .then(freshData => {
                    saveMoviesToCache(freshData);
                }).catch(() => {});
            return;
        }

        const res = await fetch("https://raw.githubusercontent.com/appcreator05/post/main/8468988.json" + "?t=" + new Date().getTime());
        let rawData = await res.json();
        
        saveMoviesToCache(rawData);
        allMoviesData = processAndShuffleMovies(rawData);
        initGridView();
    } catch (err) { 
        console.error("Error loading JSON/IndexedDB:", err); 
    }
    loader.style.display = "none";
}

function initGridView() {

// Intersection Observer: কার্ড স্ক্রিনে আসার পর src এ লিংক সেট হবে এবং অ্যানিমেশন ট্রিগার করবে
const imageObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const img = entry.target;
            const originalPoster = img.getAttribute('data-src');
            
            if (originalPoster) {
                getCachedImage(originalPoster).then(cachedImgUrl => {
                    if (cachedImgUrl) {
                        img.src = cachedImgUrl;
                        img.classList.add('zoom-anim');
                    } else {
                        img.src = originalPoster;
                        img.classList.add('zoom-anim');
                        fetch(originalPoster)
                            .then(res => res.blob())
                            .then(blob => saveImageToCache(originalPoster, blob))
                            .catch(() => {});
                    }
                });
            }
            observer.unobserve(img);
        }
    });
}, {
    root: null,
    rootMargin: '100px', 
    threshold: 0.01
});

function loadMoreMovies() {
    if (isSearching) return;

    let filtered = allMoviesData;
    if (currentCategory !== 'all') {
        filtered = allMoviesData.filter(m => (m.category || 'General') === currentCategory);
    }

    if (displayedCount >= filtered.length) return;

    const nextBatch = filtered.slice(displayedCount, displayedCount + batchSize);
    
    nextBatch.forEach((movie) => {
        const card = document.createElement('div');
        card.className = 'movieCard';
        
        card.setAttribute('data-search', (movie.title + " " + (movie.cast || "")).toLowerCase());
        card.setAttribute('data-category', movie.category || 'General');
        
        // শুরুতে src সম্পূর্ণ খালি রাখা হলো যাতে কার্ডটি ফাঁকা দেখায়
        card.innerHTML = `
            <div class="rating">★ ${movie.rating || '8.0'}</div>
            <img id="img_${movie.video}" data-src="${movie.poster}" src="" onclick="openPlayer('${movie.video}')">
            <div class="title"><span>${movie.title}</span></div>
        `;
        grid.appendChild(card);

        const imgElement = document.getElementById(`img_${movie.video}`);
        if (imgElement) {
            imageObserver.observe(imgElement);
        }
    });

    displayedCount += nextBatch.length;
}

window.addEventListener('scroll', () => {
    const scrollThreshold = window.innerHeight * 10; 
    if ((window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - scrollThreshold)) {
        loadMoreMovies();
    }
});

function loadCategories(movies) {
    const categories = [...new Set(movies.map(m => m.category || 'General'))]; 
    const catContainer = document.getElementById('categoryList');
    catContainer.innerHTML = "";
    
    categories.forEach(cat => {
        catContainer.innerHTML += `<a href="#" onclick="filterMovies('${cat}')">${cat}</a>`;
    });
}

function filterMovies(category) {
    currentCategory = category;
    isSearching = false;
    document.getElementById('searchInput').value = '';
    grid.innerHTML = "";
    displayedCount = 0;
    loadMoreMovies();
    closeSidebar();
}

function searchMovies() {
    let input = document.getElementById('searchInput').value.toLowerCase();
    if (input.trim() === "") {
        isSearching = false;
        grid.innerHTML = "";
        displayedCount = 0;
        loadMoreMovies();
        return;
    }

    isSearching = true;
    grid.innerHTML = "";
    
    let matchedMovies = allMoviesData.filter(movie => {
        let searchData = (movie.title + " " + (movie.cast || "")).toLowerCase();
        return searchData.includes(input);
    });

    matchedMovies.forEach((movie) => {
        const card = document.createElement('div');
        card.className = 'movieCard';
        card.innerHTML = `
            <div class="rating">★ ${movie.rating || '8.0'}</div>
            <img id="s_img_${movie.video}" data-src="${movie.poster}" src="" onclick="openPlayer('${movie.video}')">
            <div class="title"><span>${movie.title}</span></div>
        `;
        grid.appendChild(card);

        const imgElement = document.getElementById(`s_img_${movie.video}`);
        if (imgElement) {
            imageObserver.observe(imgElement);
        }
    });
}

window.savedOriginalOpenPlayer = openPlayer;
window.openPlayer = function(videoId) {
    processActualPlayer(videoId);
};

function processActualPlayer(videoId) {
    const themeLoader = document.getElementById("loader");
    if (themeLoader) themeLoader.style.display = "flex";

    const targetUrl = "https://debasis.installapkapps.workers.dev/?id=" + videoId;

    const driveIdMatch = targetUrl.match(/id=([a-zA-Z0-9-_]+)/) || targetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);

    if (driveIdMatch) {
        const driveId = driveIdMatch[1];
        const checkUrl = "https://lh3.googleusercontent.com/u/0/d/" + driveId + "=w200-h200-p";
        const img = new Image();
        let isLinkValid = false;

        img.onload = function() { isLinkValid = true; };
        img.onerror = function() { isLinkValid = false; };
        img.src = checkUrl;

        setTimeout(function() {
            if (isLinkValid) {
                if (window.savedOriginalOpenPlayer) window.savedOriginalOpenPlayer(videoId);
            } else {
                if (themeLoader) themeLoader.style.display = "none";
                showThemePlayerError(); 
            }
        }, 3000);
    } else {
        if (themeLoader) themeLoader.style.display = "none";
        if (window.savedOriginalOpenPlayer) window.savedOriginalOpenPlayer(videoId);
    }
}

function closePlayer(){
  if(document.fullscreenElement) document.exitFullscreen();
  player.pause();
  videoSource.src = "";
  popup.style.display = "none";
  loader.style.display = "none";
  document.body.style.overflow = "";
  screen.orientation?.unlock();
}

function toggleFull(){
  if(!document.fullscreenElement){
    container.requestFullscreen?.().then(()=>{
      screen.orientation?.lock("landscape").catch(()=>{});
    });
  } else {
    document.exitFullscreen();
  }
}

player.on('enterfullscreen', () => setTimeout(fixPlyrTimeline, 500));
player.on('exitfullscreen', () => setTimeout(fixPlyrTimeline, 500));
window.addEventListener('orientationchange', () => setTimeout(fixPlyrTimeline, 500));

function handleVideoError() {
    console.warn("Video encoding/playback error detected. Trying to recover...");
    const currentTime = player.currentTime;
    
    setTimeout(() => {
        player.currentTime = currentTime + 1;
        player.play().catch(() => {});
    }, 1000);
}

function handleVideoStalled() {
    if (videoPlayer.paused === false && player.duration > 0) {
        const currentTime = player.currentTime;
        setTimeout(() => {
            if (videoPlayer.paused) {
                player.currentTime = currentTime + 0.5;
                player.play().catch(() => {});
            }
        }, 2000);
    }
}

function startBackgroundSync() {
    setInterval(async () => {
        try {
            const res = await fetch("https://raw.githubusercontent.com/appcreator05/post/main/8468988.json" + "?t=" + new Date().getTime());
            const freshData = await res.json();
            
            if (freshData && freshData.length > 0) {
                if (freshData.length !== allMoviesData.length) {
                    allMoviesData = processAndShuffleMovies(freshData);
                    saveMoviesToCache(freshData);
                    
                    if (!isSearching && currentCategory === 'all') {
                        grid.innerHTML = "";
                        displayedCount = 0;
                        loadMoreMovies();
                    } else {
                        loadCategories(allMoviesData);
                    }
                }
            }
        } catch (e) {}
    }, 30000);
}

loadMovies();
startBackgroundSync();

            if (orDivider) orDivider.style.display = 'none';
            overlay.style.display = 'flex';
            return;
        }

        if (claimedTime) {
            if (freeSection) freeSection.style.display = 'none';
            if (orDivider) orDivider.style.display = 'none';
            
            const tenMinutes = 5 * 60 * 1000;
            const timeLeft = (parseInt(claimedTime) + tenMinutes) - Date.now();

            if (timeLeft > 0) {
                overlay.style.display = 'none';
                setTimeout(() => {
                    triggerAnchorLink();
                }, timeLeft);
            } else {
                triggerAnchorLink();
            }
        } else {
            overlay.style.display = 'flex';
        }
    }

    monitorUserSession();

    window.claimFreeMinute = () => {
        const freeSection = document.getElementById('free-section');
        const orDivider = document.getElementById('or-divider');
        const claimedTime = localStorage.getItem('vdosky_free_claimed_at');
        const freeExpired = localStorage.getItem('vdosky_free_expired');

        if (freeExpired === 'true' || claimedTime) {
            if (freeSection) freeSection.style.display = 'none';
            if (orDivider) orDivider.style.display = 'none';
            alert("You have already claimed the free minute on this device!");
            return;
        }

        const currentTime = Date.now();
        localStorage.setItem('vdosky_free_claimed_at', currentTime);

        if (freeSection) freeSection.style.display = 'none';
        if (orDivider) orDivider.style.display = 'none';

        overlay.style.display = 'none';
        const successMsg = document.getElementById('custom-success');
        successMsg.innerText = "5 Minute trial Access Activated!";
        successMsg.style.display = 'block';
        setTimeout(() => { successMsg.style.display = 'none'; }, 3000);

        setTimeout(() => {
            triggerAnchorLink();
        }, 5 * 60 * 1000);
    };

    window.autoUnlock = async (phone) => {
        const msgBox = document.getElementById('msg-box');
        const spinner = document.getElementById('loading-spinner');
        
        if (phone.length < 10) { msgBox.innerHTML = ''; spinner.style.display = 'none'; return; }

        spinner.style.display = 'block';
        msgBox.innerHTML = '';
        
        try {
            const q = query(ref(db, 'subscriptions'), orderByChild('device_id'), equalTo("dev_" + phone));
            const snapshot = await get(q);
            spinner.style.display = 'none';

            if (snapshot.exists()) {
                let foundValid = false;
                snapshot.forEach((child) => {
                    const id = child.key;
                    const sub = child.val();

                    if (sub.expireAt && Date.now() > sub.expireAt) {
                        remove(ref(db, "subscriptions/" + id));
                    } else if (sub.used === true) {
                        msgBox.innerHTML = '<p class="error">This mobile number is already used!</p>';
                    } else {
                        foundValid = true;
                        update(ref(db, 'subscriptions/' + id), { used: true }).then(() => {
                            localStorage.setItem('activePhone', phone);
                            localStorage.removeItem('sub_processed');
                            localStorage.removeItem('go_trils_fired');
                            overlay.style.display = 'none';
                            const successMsg = document.getElementById('custom-success');
                            successMsg.innerText = "Unlocked Successfully!";
                            successMsg.style.display = 'block';
                            setTimeout(() => { successMsg.style.display = 'none'; }, 3000);
                            
                            monitorUserSession();
                        });
                    }
                });
                if (!foundValid && !msgBox.innerHTML) msgBox.innerHTML = '<p class="error">Login Number not registered.<br/> Please Pay And register Number</p>';
            } else {
                msgBox.innerHTML = '<p class="error">Login Number not registered.<br/> Please Pay And register Number</p>';
                const container = document.createElement('div');
                container.style.marginTop = "15px"; container.style.display = "flex";
                container.style.gap = "10px"; container.style.justifyContent = "center";

                const razorBtn = document.createElement('button');
                razorBtn.innerText = "Pay with Razorpay";
                razorBtn.style.cssText = "padding:10px; background:#3399cc; border:none; color:white; border-radius:5px; cursor:pointer; font-weight:bold;";
                razorBtn.onclick = () => window.openInChrome("https://subs05.blogspot.com/p/register-mobile-number.html");

                const paypalBtn = document.createElement('button');
                paypalBtn.innerText = "Pay with PayPal";
                paypalBtn.style.cssText = "padding:10px; background:#ffc439; border:none; color:black; border-radius:5px; cursor:pointer; font-weight:bold;";
                paypalBtn.onclick = () => window.openInChrome("https://subs05.blogspot.com/p/mobile-number-register-paypal.html");

                container.appendChild(razorBtn); container.appendChild(paypalBtn);
                msgBox.appendChild(container);
            }
        } catch (error) {
            spinner.style.display = 'none';
            console.error(error);
        }
    };
</script>

<script>
// 1. Right Click bondho
document.addEventListener('contextmenu', event => event.preventDefault());

// 2. Advanced Security & Alt-Menu Block
function blockSecurity(e) {
    // Alt key block (System Menu block korar chesta)
    if (e.altKey || e.keyCode == 18) {
        e.preventDefault();
        return false;
    }

    // F12, Ctrl+U, Ctrl+Shift+I, Ctrl+S, Ctrl+C block
    if (e.keyCode == 123 || 
        (e.ctrlKey && e.keyCode == 85) || 
        (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || 
        (e.ctrlKey && e.keyCode == 83) || 
        (e.ctrlKey && e.keyCode == 67)) {
        e.preventDefault();
        return false;
    }
}

// Keydown ebong Keyup — duto event-ei block kora hochhe jate menu na ashe
document.addEventListener('keydown', blockSecurity);
document.addEventListener('keyup', blockSecurity);

// 3. Text Selection block
document.onselectstart = function() { return false; };
</script>
